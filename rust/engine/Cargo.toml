[package]
name = "epichub-engine"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "epichub_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "=0.21.1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
