name: Foundation quality

on:
  push:
    branches:
      - phase2/foundation-bootstrap
  pull_request:
    branches:
      - main

concurrency:
  group: foundation-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  EPICHUB_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EPICHUB_SOURCE_SHA }}

      - name: Verify qualified source SHA
        shell: bash
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EPICHUB_SOURCE_SHA"
          echo "Qualifying source SHA: $ACTUAL_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK/NDK components
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          TOOLS_ZIP="$RUNNER_TEMP/commandlinetools-linux-15859902_latest.zip"
          TOOLS_DIR="$RUNNER_TEMP/android-command-line-tools"

          curl --fail --location --silent --show-error \
            --output "$TOOLS_ZIP" \
            "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $TOOLS_ZIP" | sha256sum --check --strict
          mkdir -p "$TOOLS_DIR"
          unzip -q "$TOOLS_ZIP" -d "$TOOLS_DIR"

          SDKMANAGER="$TOOLS_DIR/cmdline-tools/bin/sdkmanager"
          ANDROID_CLI="$TOOLS_DIR/cmdline-tools/bin/android"
          test -x "$SDKMANAGER"
          test -x "$ANDROID_CLI"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$ANDROID_CLI" --sdk="$SDK_ROOT" sdk install --canary \
            platforms/android-37.0 \
            build-tools/37.0.0 \
            ndk/30.0.16248370

          test -f "$SDK_ROOT/platforms/android-37.0/android.jar"
          test -x "$SDK_ROOT/build-tools/37.0.0/aapt2"
          test -x "$SDK_ROOT/build-tools/37.0.0/apksigner"
          test -d "$SDK_ROOT/ndk/30.0.16248370"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Set up Rust 1.98.1
        shell: bash
        run: |
          rustup toolchain install 1.98.1 \
            --profile minimal \
            --component rustfmt,clippy \
            --target armv7-linux-androideabi,aarch64-linux-android
          rustup override set 1.98.1

      - name: Install cargo-ndk 4.1.2
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Rust format
        run: cargo fmt --manifest-path rust/engine/Cargo.toml -- --check

      - name: Rust lint
        run: cargo clippy --manifest-path rust/engine/Cargo.toml --locked --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path rust/engine/Cargo.toml --locked

      - name: Android JVM tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android debug build
        run: gradle :app:assembleDebug --stacktrace

      - name: Android performance build
        run: gradle :app:assemblePerformance --stacktrace

      - name: Android Macrobenchmark harness build
        run: gradle :benchmark:assemblePerformance --stacktrace

      - name: Verify APK signatures
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$SDK_ROOT/build-tools/37.0.0/apksigner"
          for APK in \
            app/build/outputs/apk/performance/app-performance.apk \
            benchmark/build/outputs/apk/performance/benchmark-performance.apk
          do
            test -f "$APK"
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          done

      - name: Verify production ARM libraries in APKs
        shell: bash
        run: |
          for APK in \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/performance/app-performance.apk
          do
            test -f "$APK"
            CONTENTS="$RUNNER_TEMP/$(basename "$APK").contents.txt"
            unzip -Z1 "$APK" > "$CONTENTS"
            grep -Fxq "lib/armeabi-v7a/libepichub_engine.so" "$CONTENTS"
            grep -Fxq "lib/arm64-v8a/libepichub_engine.so" "$CONTENTS"

            mapfile -t EPICHUB_LIBS < <(grep '/libepichub_engine\.so$' "$CONTENTS")
            test "${#EPICHUB_LIBS[@]}" -eq 2
            printf 'Verified %s native libraries:\n%s\n' "$APK" "${EPICHUB_LIBS[*]}"
          done

      - name: Prepare physical benchmark kit
        shell: bash
        run: |
          KIT="$RUNNER_TEMP/epichub-performance-benchmark-kit"
          rm -rf "$KIT"
          mkdir -p "$KIT"

          cp app/build/outputs/apk/performance/app-performance.apk \
            "$KIT/EpicHub-Performance.apk"
          cp benchmark/build/outputs/apk/performance/benchmark-performance.apk \
            "$KIT/EpicHub-Macrobenchmark.apk"
          cp scripts/run-performance-benchmark.ps1 \
            "$KIT/run-performance-benchmark.ps1"
          cp scripts/run-performance-benchmark.sh \
            "$KIT/run-performance-benchmark.sh"
          chmod +x "$KIT/run-performance-benchmark.sh"
          cp docs/PERFORMANCE_BENCHMARKING.md \
            "$KIT/PERFORMANCE_BENCHMARKING.md"

          {
            echo "EpicHub qualified physical benchmark kit"
            echo "sourceSha=$EPICHUB_SOURCE_SHA"
            echo "workflowRun=${{ github.run_id }}"
            echo "workflowRunNumber=${{ github.run_number }}"
            echo
            sha256sum \
              "$KIT/EpicHub-Performance.apk" \
              "$KIT/EpicHub-Macrobenchmark.apk" \
              | sed "s#  $KIT/#  #"
          } > "$KIT/QUALIFIED_BUILD.txt"

      - name: Publish qualified foundation debug APK
        uses: actions/upload-artifact@v7
        with:
          name: epichub-foundation-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish qualified performance APK
        uses: actions/upload-artifact@v7
        with:
          name: epichub-foundation-performance
          path: app/build/outputs/apk/performance/app-performance.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish qualified Macrobenchmark APK
        uses: actions/upload-artifact@v7
        with:
          name: epichub-macrobenchmark-performance
          path: benchmark/build/outputs/apk/performance/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish physical benchmark kit
        uses: actions/upload-artifact@v7
        with:
          name: epichub-performance-benchmark-kit
          path: ${{ runner.temp }}/epichub-performance-benchmark-kit
          if-no-files-found: error
          retention-days: 14
