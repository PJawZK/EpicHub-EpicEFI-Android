name: Foundation quality

on:
  push:
    branches:
      - phase2/foundation-bootstrap
  pull_request:
    branches:
      - main

concurrency:
  group: foundation-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK/NDK components
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          TOOLS_ZIP="$RUNNER_TEMP/commandlinetools-linux-15859902_latest.zip"
          TOOLS_DIR="$RUNNER_TEMP/android-command-line-tools"

          curl --fail --location --silent --show-error \
            --output "$TOOLS_ZIP" \
            "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $TOOLS_ZIP" | sha256sum --check --strict
          mkdir -p "$TOOLS_DIR"
          unzip -q "$TOOLS_ZIP" -d "$TOOLS_DIR"

          SDKMANAGER="$TOOLS_DIR/cmdline-tools/bin/sdkmanager"
          ANDROID_CLI="$TOOLS_DIR/cmdline-tools/bin/android"
          test -x "$SDKMANAGER"
          test -x "$ANDROID_CLI"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$ANDROID_CLI" --sdk="$SDK_ROOT" sdk install --canary \
            platforms/android-37.0 \
            build-tools/37.0.0 \
            ndk/30.0.16248370

          test -f "$SDK_ROOT/platforms/android-37.0/android.jar"
          test -x "$SDK_ROOT/build-tools/37.0.0/aapt2"
          test -d "$SDK_ROOT/ndk/30.0.16248370"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Set up Rust 1.98.1
        shell: bash
        run: |
          rustup toolchain install 1.98.1 \
            --profile minimal \
            --component rustfmt,clippy \
            --target armv7-linux-androideabi,aarch64-linux-android
          rustup override set 1.98.1

      - name: Install cargo-ndk 4.1.2
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Rust format
        run: cargo fmt --manifest-path rust/engine/Cargo.toml -- --check

      - name: Rust lint
        run: cargo clippy --manifest-path rust/engine/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path rust/engine/Cargo.toml

      - name: Publish generated Rust lockfile
        if: ${{ always() && hashFiles('rust/engine/Cargo.lock') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: epichub-rust-lockfile
          path: rust/engine/Cargo.lock
          if-no-files-found: error
          retention-days: 2

      - name: Android JVM tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android debug build
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify production ARM libraries in APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -Z1 "$APK" > "$RUNNER_TEMP/apk-contents.txt"
          grep -Fxq "lib/armeabi-v7a/libepichub_engine.so" "$RUNNER_TEMP/apk-contents.txt"
          grep -Fxq "lib/arm64-v8a/libepichub_engine.so" "$RUNNER_TEMP/apk-contents.txt"

          mapfile -t EPICHUB_LIBS < <(grep '/libepichub_engine\.so$' "$RUNNER_TEMP/apk-contents.txt")
          test "${#EPICHUB_LIBS[@]}" -eq 2
          printf 'Verified packaged native libraries:\n%s\n' "${EPICHUB_LIBS[@]}"

      - name: Publish qualified foundation APK
        uses: actions/upload-artifact@v7
        with:
          name: epichub-foundation-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
