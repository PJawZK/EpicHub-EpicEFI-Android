name: Foundation quality

on:
  push:
    branches:
      - phase2/foundation-bootstrap
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK/NDK components
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370" \
            --channel=3

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Rust 1.98.1
        shell: bash
        run: |
          rustup toolchain install 1.98.1 \
            --profile minimal \
            --component rustfmt,clippy \
            --target armv7-linux-androideabi,aarch64-linux-android
          rustup override set 1.98.1

      - name: Install cargo-ndk 4.1.2
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Rust format
        run: cargo fmt --manifest-path rust/engine/Cargo.toml -- --check

      - name: Rust lint
        run: cargo clippy --manifest-path rust/engine/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path rust/engine/Cargo.toml

      - name: Android debug build
        run: gradle :app:assembleDebug --stacktrace
