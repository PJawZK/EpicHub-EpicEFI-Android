name: Prototype quality

on:
  pull_request:
    branches:
      - main
    paths:
      - 'prototype/**'
      - '.github/workflows/prototype-quality.yml'
      - '.github/workflows/prototype-pages.yml'
  push:
    branches:
      - main
    paths:
      - 'prototype/**'
      - '.github/workflows/prototype-quality.yml'
      - '.github/workflows/prototype-pages.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: prototype

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: prototype/package.json

      - name: Install prototype dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck, test and build prototype
        run: npm run build

      - name: Upload prototype build
        uses: actions/upload-artifact@v7
        with:
          name: epichub-pages-prototype
          path: prototype/dist
          if-no-files-found: error
          retention-days: 14
